services:
  muse2api:
    build: .
    image: muse2api:latest
    restart: unless-stopped
    environment:
      MUSE2API_HOST: 0.0.0.0
      MUSE2API_CHROMIUM_PATH: /usr/bin/chromium
      MUSE2API_BROWSER_NO_SANDBOX: "true"
      PYTHONPATH: /app/src
    env_file:
      - path: .env
    ports:
      - "18610:18610"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    shm_size: "1gb"
